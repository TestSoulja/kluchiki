<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- frame-ancestors браузер принимает только HTTP-заголовком: в meta он
     игнорируется и пишет ошибку в консоль. Статический хостинг заголовков
     не даёт, поэтому здесь политики без него; это записано в plan.md §11. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; worker-src 'self'; font-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#101216">
<title>Kluchiki — менеджер паролей в браузере</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./app/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./app/icons/icon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="./app/icons/icon-192.png">
<link rel="stylesheet" href="./app/style.css">
</head>
<body>
<main id="app" class="app"></main>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
<noscript>
  <p class="noscript">Kluchiki считает всё в браузере, поэтому без JavaScript
  приложение не работает. Включите JavaScript для этой страницы.</p>
</noscript>
<script type="module" src="./app/main.js"></script>
</body>
</html>
